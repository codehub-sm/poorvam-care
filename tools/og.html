<!doctype html>
<!-- Share image (assets/img/og.png, 1200x630). Regenerate with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --virtual-time-budget=4000 --screenshot=assets/img/og.png tools/og.html
  Text mirrors TAGLINE in src/site.mjs; keep the two in step. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Figtree:wght@400;500&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Figtree, sans-serif; color: #fff; display: grid; grid-template-columns: 1fr 470px; align-items: center;
    background: #064a8b; } /* the logo's own field, so the mark sits on it seamlessly */
  .txt { padding: 0 0 0 72px; }
  .word { font-family: Montserrat, sans-serif; line-height: 1; margin-bottom: 56px; }
  .word b { display: block; font-weight: 700; font-size: 44px; letter-spacing: .06em; }
  .word i { display: block; font-style: normal; font-weight: 600; font-size: 19px; letter-spacing: .34em; color: #49bd58; margin-top: 10px; }
  h1 { font-family: Montserrat, sans-serif; font-weight: 700; font-size: 70px; line-height: 1.05; letter-spacing: -.02em; margin: 0 0 26px; }
  p { font-size: 29px; line-height: 1.35; margin: 0; color: rgb(255 255 255 / .88); }
  img { width: 470px; height: 470px; }
</style></head>
<body>
  <div class="txt">
    <div class="word"><b>POORVAM</b><i>CARE</i></div>
    <h1>Help your child<br>find their words.</h1>
    <p>Speech therapy, occupational therapy and early intervention in Electronic City, Bengaluru, and online.</p>
  </div>
  <img src="../assets/img/favicon-512.png" alt="">
</body></html>
