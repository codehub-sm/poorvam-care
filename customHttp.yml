# Amplify Hosting response headers. Amplify reads this file from the repo root.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
  # Pages change with each deploy; let browsers and CloudFront revalidate quickly.
  - pattern: '*.html'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=300, must-revalidate
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=300, must-revalidate
  # Asset names are not hashed, so a week, not forever.
  - pattern: 'assets/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=604800
  - pattern: '*.txt'
    headers:
      - key: Content-Type
        value: text/plain; charset=utf-8
      - key: Cache-Control
        value: public, max-age=3600
