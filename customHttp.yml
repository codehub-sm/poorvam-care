# Amplify Hosting response headers. Amplify reads this file from the repo root.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
  # Pages change with each deploy; let browsers and CloudFront revalidate quickly.
  - pattern: '*.html'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=300, must-revalidate
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=300, must-revalidate
  # Fingerprinted CSS/JS (src/assets.mjs) and versioned font files: the name
  # changes with the content, so cache for a year.
  - pattern: 'assets/v/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: 'assets/fonts/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Images keep their names when replaced, so a week, not forever.
  - pattern: 'assets/img/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=604800
  # Unhashed copies, kept only for pages cached before fingerprinting.
  - pattern: 'assets/css/*'
    headers:
      - key: Cache-Control
        value: public, max-age=3600
  - pattern: 'assets/js/*'
    headers:
      - key: Cache-Control
        value: public, max-age=3600
  - pattern: '*.txt'
    headers:
      - key: Content-Type
        value: text/plain; charset=utf-8
      - key: Cache-Control
        value: public, max-age=3600
