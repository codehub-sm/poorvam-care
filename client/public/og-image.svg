<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2319;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D3229;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8725A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4A698;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="#E8725A" opacity="0.08"/>
  <circle cx="150" cy="530" r="150" fill="#7BA87B" opacity="0.08"/>
  <circle cx="900" cy="500" r="120" fill="#B8A9D4" opacity="0.06"/>

  <!-- Top accent bar -->
  <rect x="80" y="80" width="60" height="4" rx="2" fill="#E8725A"/>
  <rect x="150" y="80" width="30" height="4" rx="2" fill="#7BA87B"/>

  <!-- Brand name -->
  <text x="80" y="160" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#E8725A">
    Poorvam<tspan fill="#7BA87B">.</tspan> Care
  </text>

  <!-- Main heading -->
  <text x="80" y="250" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFF8F0">
    Speech Therapy &amp; Occupational
  </text>
  <text x="80" y="305" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFF8F0">
    Therapy for Children
  </text>

  <!-- Location -->
  <text x="80" y="370" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#F4A698">
    Electronic City, Bangalore
  </text>

  <!-- Description -->
  <text x="80" y="430" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFF8F0" opacity="0.75">
    Early intervention for ASD, speech delay, ADHD &amp; developmental challenges
  </text>
  <text x="80" y="460" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFF8F0" opacity="0.75">
    Led by Apoorva Rai, MASLP | 13+ years experience
  </text>

  <!-- Bottom bar with trust signals -->
  <rect x="0" y="530" width="1200" height="100" fill="#241C13"/>

  <!-- Trust badges -->
  <text x="80" y="575" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#7BA87B">
    RCI Licensed
  </text>
  <text x="220" y="575" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFF8F0" opacity="0.3">|</text>
  <text x="250" y="575" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#7BA87B">
    ISHA Certified
  </text>
  <text x="410" y="575" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFF8F0" opacity="0.3">|</text>
  <text x="440" y="575" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#7BA87B">
    2500+ Families
  </text>
  <text x="610" y="575" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFF8F0" opacity="0.3">|</text>
  <text x="640" y="575" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#7BA87B">
    13+ Years
  </text>

  <!-- Website URL -->
  <text x="1120" y="575" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFF8F0" opacity="0.5" text-anchor="end">
    poorvamcare.in
  </text>

  <!-- Rating stars area -->
  <text x="80" y="600" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFF8F0" opacity="0.4">
    4.5/5 on Justdial (61 reviews)
  </text>
</svg>
